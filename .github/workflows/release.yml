name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release after building"
        required: false
        default: false
        type: boolean
      tag_name:
        description: "Release tag for manual publish, e.g. v0.1.0"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Validate Python sources
        shell: pwsh
        run: python -m py_compile desktop_cat.py desktop_cat_panel.pyw

      - name: Build release bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\package_release.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pawly-windows-x64
          path: |
            dist-release/Pawly-windows-x64.zip
            dist-release/Pawly-windows-x64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true'
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
          TARGET_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tagName = process.env.TAG_NAME;
            if (!tagName) {
              core.setFailed('tag_name is required when publishing a manual release.');
              return;
            }

            let release;
            try {
              release = (
                await github.rest.repos.getReleaseByTag({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag: tagName,
                })
              ).data;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }

              release = (
                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tagName,
                  target_commitish: process.env.TARGET_SHA,
                  name: tagName,
                  generate_release_notes: true,
                })
              ).data;
            }

            const assetPaths = [
              'dist-release/Pawly-windows-x64.zip',
              'dist-release/Pawly-windows-x64.zip.sha256',
            ];

            const existingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100,
            });

            for (const assetPath of assetPaths) {
              const assetName = path.basename(assetPath);
              const existingAsset = existingAssets.find((asset) => asset.name === assetName);
              if (existingAsset) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: existingAsset.id,
                });
              }

              const assetData = fs.readFileSync(assetPath);
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: assetName,
                headers: {
                  'content-type': assetName.endsWith('.zip') ? 'application/zip' : 'text/plain',
                  'content-length': assetData.length,
                },
                data: assetData,
              });
            }
