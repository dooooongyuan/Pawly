name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release after building"
        required: false
        default: false
        type: boolean
      tag_name:
        description: "Release tag for manual publish, e.g. v0.1.0"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt

      - name: Validate Python sources
        shell: pwsh
        run: python -m py_compile desktop_cat.py desktop_cat_panel.pyw

      - name: Build release bundle
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\package_release.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pawly-windows-x64
          path: |
            dist-release/Pawly-windows-x64.zip
            dist-release/Pawly-windows-x64.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish_release == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
          GITHUB_TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.tag_name }}
          GITHUB_TARGET_SHA: ${{ github.sha }}
        run: |
          if (-not $env:GITHUB_TAG_NAME) {
              throw "tag_name is required when publishing a manual release."
          }

          $headers = @{
              Authorization = "Bearer $env:GITHUB_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
          }

          $release = $null
          try {
              $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY_NAME/releases/tags/$env:GITHUB_TAG_NAME" -Method GET
          } catch {
              $body = @{
                  tag_name = $env:GITHUB_TAG_NAME
                  target_commitish = $env:GITHUB_TARGET_SHA
                  name = $env:GITHUB_TAG_NAME
                  generate_release_notes = $true
              } | ConvertTo-Json

              $release = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY_NAME/releases" -Method POST -Body $body
          }

          $uploadBase = ($release.upload_url -replace '\{\?name,label\}', '')
          $assetPaths = @(
              (Resolve-Path 'dist-release/Pawly-windows-x64.zip').Path,
              (Resolve-Path 'dist-release/Pawly-windows-x64.zip.sha256').Path
          )

          foreach ($assetPath in $assetPaths) {
              $assetName = [System.IO.Path]::GetFileName($assetPath)
              foreach ($asset in @($release.assets)) {
                  if ($asset.name -eq $assetName) {
                      Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY_NAME/releases/assets/$($asset.id)" -Method DELETE
                  }
              }

              $contentType = if ($assetName.EndsWith('.zip')) { 'application/zip' } else { 'text/plain' }
              $uploadHeaders = @{
                  Authorization = "Bearer $env:GITHUB_TOKEN"
                  Accept = "application/vnd.github+json"
                  "X-GitHub-Api-Version" = "2022-11-28"
                  "Content-Type" = $contentType
              }

              Invoke-RestMethod -Headers $uploadHeaders -Uri "$uploadBase?name=$assetName" -Method POST -InFile $assetPath
          }
